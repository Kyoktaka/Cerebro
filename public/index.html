<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Cerebro | Your AI study companion</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ultracave.css">
</head>
<body class="studio-home">
    <a class="skip-link" href="#main">Skip to study prompt</a>
    <header class="studio-header">
        <a href="index.html" class="studio-brand"><span class="logo-mark"><i class="fas fa-brain" aria-hidden="true"></i></span> Cerebro</a>
        <nav class="studio-nav" aria-label="Main navigation">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"><i class="fas fa-moon" aria-hidden="true"></i><span data-theme-label>Dark mode</span></button>
            <a href="chat.html">Workspace</a>
            <div id="authButtons" class="auth-buttons"><a href="login.html" class="studio-signin">Sign in</a></div>
        </nav>
    </header>
    <main class="studio-main" id="main">
        <p class="studio-eyebrow">Your AI study companion</p>
        <h1>What would you like to study?</h1>
        <form class="studio-composer" id="homePromptForm">
            <label for="homePrompt" class="chat-message-label">Ask a question</label>
            <textarea id="homePrompt" name="prompt" rows="3" placeholder="Ask anything about your documents..." required></textarea>
            <div class="studio-composer-actions"><span>Ask, learn, review.</span><button type="submit" class="studio-submit" aria-label="Continue to chat"><i class="fas fa-arrow-up" aria-hidden="true"></i></button></div>
        </form>
        <div class="studio-shortcuts" aria-label="Start studying">
            <button type="button" data-home-action="upload"><i class="fas fa-paperclip" aria-hidden="true"></i> Upload PDF</button>
            <button type="button" data-home-action="Create a multiple-choice quiz with four options per question."><i class="fas fa-list-check" aria-hidden="true"></i> Create quiz</button>
            <button type="button" data-home-action="Generate flashcards with clear front and back sides."><i class="far fa-rectangle-list" aria-hidden="true"></i> Flashcards</button>
            <button type="button" data-home-action="Summarize the focused PDF documents."><i class="far fa-file-lines" aria-hidden="true"></i> Summarize</button>
        </div>
        <p class="studio-caption">Cerebro runs through your local Ollama models. <a href="about.html">How it works</a></p>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
