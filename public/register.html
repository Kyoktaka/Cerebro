<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Create an account | Cerebro</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <a class="skip-link" href="#main">Skip to registration</a>
    <header class="auth-topbar">
        <a href="index.html" class="auth-brand"><span class="logo-mark"><i class="fas fa-brain" aria-hidden="true"></i></span><span>Cerebro</span></a>
        <button class="theme-toggle" type="button" data-theme-toggle><i class="fas fa-moon" aria-hidden="true"></i><span data-theme-label>Dark mode</span></button>
    </header>
    <main class="auth-wrapper" id="main">
        <div class="auth-container">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left" aria-hidden="true"></i> Home</a>
            <section class="auth-card">
                <div class="auth-header"><p class="kicker">Start locally</p><h1>Create your account.</h1><p>Keep your study conversations on this computer.</p></div>
                <div id="errorMessage" class="error-message" role="alert" aria-live="assertive"></div>
                <form id="registerForm">
                    <div class="row">
                        <div class="input-group"><label for="firstName">First name</label><input type="text" id="firstName" name="firstName" autocomplete="given-name" required></div>
                        <div class="input-group"><label for="lastName">Last name (username)</label><input type="text" id="lastName" name="lastName" autocomplete="family-name" required></div>
                    </div>
                    <p class="username-note">If your last name is common, add an initial to make the username unique.</p>
                    <div class="input-group"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" required></div>
                    <div class="input-group"><label for="password">Password</label><div class="password-field"><input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required><button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
                    <div class="input-group"><label for="confirmPassword">Confirm password</label><div class="password-field"><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" required><button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button></div></div>
                    <button type="submit" class="btn-auth">Create account</button>
                </form>
                <p class="auth-security-note">Use a password you do not use elsewhere.</p>
                <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
            </section>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
