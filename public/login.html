<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in | Cerebro</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <a class="skip-link" href="#main">Skip to sign in</a>
    <header class="auth-topbar">
        <a href="index.html" class="auth-brand"><span class="logo-mark"><i class="fas fa-brain" aria-hidden="true"></i></span><span>Cerebro</span></a>
        <button class="theme-toggle" type="button" data-theme-toggle><i class="fas fa-moon" aria-hidden="true"></i><span data-theme-label>Dark mode</span></button>
    </header>
    <main class="auth-wrapper" id="main">
        <div class="auth-container">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left" aria-hidden="true"></i> Home</a>
            <section class="auth-card">
                <div class="auth-header"><p class="kicker">Your workspace</p><h1>Welcome back.</h1><p>Sign in to pick up your conversations.</p></div>
                <div id="errorMessage" class="error-message" role="alert" aria-live="assertive"></div>
                <div id="successMessage" class="success-message" role="status" hidden>Account created. Sign in to continue.</div>
                <form id="loginForm">
                    <div class="input-group"><label for="username">Last name (username)</label><input type="text" id="username" name="username" autocomplete="username" placeholder="Your last name" required></div>
                    <div class="input-group"><label for="password">Password</label><div class="password-field"><input type="password" id="password" name="password" autocomplete="current-password" required><button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false">Show</button></div></div>
                    <div class="auth-options"><button type="button" id="forgotPassword">Forgot password?</button></div>
                    <button type="submit" class="btn-auth">Sign in</button>
                </form>
                <p class="auth-footer">New to Cerebro? <a href="register.html">Create an account</a></p>
            </section>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
